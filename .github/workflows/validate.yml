name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libxml2-utils + shellcheck
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils shellcheck

      - name: Run skill validation
        run: bash ./scripts/validate.sh

      - name: ShellCheck scripts
        run: shellcheck -x scripts/*.sh

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Selftest (validate + craig + remix)
        run: bash ./scripts/selftest.sh
