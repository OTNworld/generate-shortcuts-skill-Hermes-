name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libxml2-utils + shellcheck
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils shellcheck

      - name: Validate + selftest
        run: |
          bash ./scripts/validate.sh
          bash ./scripts/selftest.sh

      - name: Generate release notes (linux-complete profile)
        run: bash ./scripts/cut_release.sh --notes-only --mode linux

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="fixtures/release/RELEASE_${TAG}_linux.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing $NOTES" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skip create"
          else
            gh release create "$TAG" \
              --title "$TAG — Linux-complete (Mac attest pending for post-1.10 deltas)" \
              --notes-file "$NOTES"
          fi
